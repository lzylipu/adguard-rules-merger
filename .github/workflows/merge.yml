name: Merge & Update Rules

on:
  schedule:
    - cron: "1 21,2,7,12,16 * * *"
  workflow_dispatch:
  push:
    paths:
      - sources.yaml
      - merge.py

permissions:
  contents: write
  pages: write

# 同一时刻只允许一个 merge 运行；新触发会取消旧的，避免并发写 main 互相顶掉
concurrency:
  group: merge-rules
  cancel-in-progress: true

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 需要完整历史才能 rebase 到远端最新提交
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pyyaml

      - name: Download sources (refresh upstream)
        run: python download_sources.py

      - name: Run merger
        run: python merge.py

      - name: Stats
        run: |
          STD=$(python3 -c "import json; d=json.load(open('stats.json')); print(d['standard']['total'])")
          FULL=$(python3 -c "import json; d=json.load(open('stats.json')); print(d['full']['total'])")
          WHITE=$(python3 -c "import json; print(json.load(open('stats.json'))['whitelist']['total'])")
          echo "STD_COUNT=$STD" >> "$GITHUB_ENV"
          echo "FULL_COUNT=$FULL" >> "$GITHUB_ENV"
          echo "WHITE_COUNT=$WHITE" >> "$GITHUB_ENV"

      - name: Commit stats
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add stats.json sources/

          # 没有实际变化就跳过，避免空提交
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi

          git commit -m "stats: std ${{ env.STD_COUNT }} / full ${{ env.FULL_COUNT }} / whitelist ${{ env.WHITE_COUNT }}"

          # 关键：推送前先 rebase 到远端最新，避免 non-fast-forward
          # 最多重试 3 次（rebase 冲突时丢弃本地提交，以远端为准）
          for i in 1 2 3; do
            if git pull --rebase origin main; then
              if git push origin main; then
                echo "pushed on attempt $i"
                exit 0
              fi
            else
              echo "rebase conflict on attempt $i, resetting to remote"
              git rebase --abort 2>/dev/null || true
              git reset --hard origin/main
            fi
            sleep 5
          done

          echo "failed to push after 3 attempts"
          exit 1

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          force_orphan: true
          exclude_assets: ".github,merge.py,sources.yaml,__pycache__,.nojekyll"